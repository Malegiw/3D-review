name: Convert models (NWD / DWFx / SKP → GLB)

# Optional encryption: when the NEXUS app uploads *.nxe files (AES-256-GCM, key = secret NEXUS_KEY), they are
# decrypted on the runner and the results are encrypted the same way before being committed.
# Without encryption, files in a PUBLIC repository are downloadable by anyone.
# Input:  files committed to models/incoming/ (the NEXUS app does this for you), or "Run workflow" with a direct link.
# Engines:
#   .nwd .nwc  → nwd-reader + nwd2glb, runs entirely on the GitHub runner — no Autodesk account needed.
#                nwd-reader is PolyForm Noncommercial 1.0.0 (https://github.com/1817716374/nwd-reader);
#                commercial use requires a licence from its author.
#   .nwf .dwfx .dwf .skp .rvt .ifc .dwg → Autodesk APS Model Derivative; needs secrets APS_CLIENT_ID / APS_CLIENT_SECRET.
# Output: GLB in converted/glb/ (+ index.json) in this repo — the NEXUS app downloads it automatically — and as a
#         workflow artifact. Repository variable PUBLISH_MODELS=true publishes to public/models/ on GitHub Pages instead.
on:
  push:
    branches: [main]
    paths: ['models/incoming/**']
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct download link to a .nwd / .nwc / .dwfx / .skp / .rvt / .ifc file (optional)'
        required: false
      selftest:
        description: 'Only build and check the NWD reader (no files needed)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: convert-models
  cancel-in-progress: false

env:
  NWD_READER_REF: 0a225c4d171b1bd1a675cf309279a9f9a5191c3f
  PUBLISH: ${{ vars.PUBLISH_MODELS == 'true' }}

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Collect input files
        id: files
        env:
          FILE_URL: ${{ github.event.inputs.file_url }}
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          mkdir -p models/incoming "$RUNNER_TEMP/dl" "$RUNNER_TEMP/dec"
          shopt -s nullglob nocaseglob
          nxe=(models/incoming/*.nxe)
          ENC=false; [ ${#nxe[@]} -gt 0 ] && ENC=true
          if [ ${#nxe[@]} -gt 0 ]; then
            if [ -z "$NEXUS_KEY" ]; then echo "::error::Encrypted uploads found but the NEXUS_KEY secret is missing."; exit 1; fi
            node tools/nxe.mjs decrypt-dir models/incoming "$RUNNER_TEMP/dec"
          fi
          # downloaded files stay outside the repo so they are never committed
          if [ -n "$FILE_URL" ]; then curl -fsSLJO --output-dir "$RUNNER_TEMP/dl" "$FILE_URL"; fi
          nwd=(models/incoming/*.{nwd,nwc} "$RUNNER_TEMP"/dl/*.{nwd,nwc} "$RUNNER_TEMP"/dec/*.{nwd,nwc})
          aps=(models/incoming/*.{nwf,dwfx,dwf,skp,rvt,ifc,dwg} "$RUNNER_TEMP"/dl/*.{nwf,dwfx,dwf,skp,rvt,ifc,dwg} "$RUNNER_TEMP"/dec/*.{nwf,dwfx,dwf,skp,rvt,ifc,dwg})
          if [ "$IS_PRIVATE" != "true" ] && [ ${#nxe[@]} -eq 0 ] && [ $(( ${#nwd[@]} + ${#aps[@]} )) -gt 0 ]; then
            echo "::notice::Public repository without encryption: inputs and GLB results are publicly downloadable."
          fi
          printf '%s\n' "${nwd[@]}" > "$RUNNER_TEMP/nwd.txt"
          printf '%s\n' "${aps[@]}" > "$RUNNER_TEMP/aps.txt"
          FINAL=converted/glb
          if [ "$PUBLISH" = "true" ] && [ "$ENC" != "true" ]; then FINAL=public/models; fi
          OUT="$FINAL"
          if [ "$ENC" = "true" ]; then OUT="$RUNNER_TEMP/plain-out"; fi
          echo "nwd=${#nwd[@]}" >> "$GITHUB_OUTPUT"
          echo "aps=${#aps[@]}" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "final=$FINAL" >> "$GITHUB_OUTPUT"
          echo "enc=$ENC" >> "$GITHUB_OUTPUT"
          echo "NWD/NWC: ${#nwd[@]} · Autodesk formats: ${#aps[@]} · encrypted: $ENC"

      - name: Check Autodesk credentials
        if: steps.files.outputs.aps != '0'
        env:
          ID: ${{ secrets.APS_CLIENT_ID }}
          SECRET: ${{ secrets.APS_CLIENT_SECRET }}
        run: |
          if [ -z "$ID" ] || [ -z "$SECRET" ]; then
            echo "::error::DWFx / SKP / RVT / IFC / NWF files need APS_CLIENT_ID and APS_CLIENT_SECRET (Settings → Secrets and variables → Actions). NWD and NWC files do not."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.files.outputs.nwd != '0' || steps.files.outputs.aps != '0'
        with:
          node-version: 22

      - name: Install converter
        if: steps.files.outputs.nwd != '0' || steps.files.outputs.aps != '0'
        working-directory: tools
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Restore nwd-reader build
        id: nwdcache
        if: steps.files.outputs.nwd != '0' || inputs.selftest
        uses: actions/cache@v4
        with:
          path: ~/nwd-install
          key: nwd-reader-${{ env.NWD_READER_REF }}-${{ runner.os }}

      - name: Install NWD reader (nwd-reader, PolyForm Noncommercial)
        if: (steps.files.outputs.nwd != '0' || inputs.selftest) && steps.nwdcache.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/nwd-src" && cd "$RUNNER_TEMP/nwd-src"
          git remote add origin https://github.com/1817716374/nwd-reader
          git fetch -q --depth 1 origin "$NWD_READER_REF" && git checkout -q FETCH_HEAD
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/nwd-install"
          cmake --build build --config Release --parallel "$(nproc)"
          cmake --install build --config Release

      - name: Self-test NWD reader
        if: inputs.selftest
        run: |
          cmake -S tools/nwd2glb -B "$RUNNER_TEMP/n2g" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/nwd-install"
          cmake --build "$RUNNER_TEMP/n2g" --parallel "$(nproc)"
          set +e; "$RUNNER_TEMP/n2g/nwd2glb"; code=$?; set -e
          [ "$code" = "2" ] && echo "nwd2glb built and runs (usage exit code 2) on $(lsb_release -ds), $(g++ --version | head -1)"

      - name: Convert NWD / NWC (no Autodesk)
        if: steps.files.outputs.nwd != '0'
        env:
          NEXUS_QUIET: ${{ steps.files.outputs.enc == 'true' && '1' || '' }}
        run: |
          cmake -S tools/nwd2glb -B "$RUNNER_TEMP/n2g" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/nwd-install"
          cmake --build "$RUNNER_TEMP/n2g" --parallel "$(nproc)"
          mapfile -t files < "$RUNNER_TEMP/nwd.txt"
          NWD2GLB="$RUNNER_TEMP/n2g/nwd2glb" node tools/nwd-convert.mjs "${files[@]}" --out "${{ steps.files.outputs.out }}"

      - name: Convert with Autodesk APS
        if: steps.files.outputs.aps != '0'
        env:
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
        run: |
          mapfile -t files < "$RUNNER_TEMP/aps.txt"
          node tools/aps-convert.mjs "${files[@]}" --out "${{ steps.files.outputs.out }}"

      - name: Encrypt results
        if: steps.files.outputs.enc == 'true' && (steps.files.outputs.nwd != '0' || steps.files.outputs.aps != '0')
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: node tools/nxe.mjs encrypt-out "${{ steps.files.outputs.out }}" "${{ steps.files.outputs.final }}"

      - name: Upload GLB (also downloadable from this run's Summary page)
        if: steps.files.outputs.enc != 'true' && (steps.files.outputs.nwd != '0' || steps.files.outputs.aps != '0')
        uses: actions/upload-artifact@v4
        with:
          name: nexus3d-glb
          path: ${{ steps.files.outputs.out }}/*.glb
          retention-days: 14

      - name: Commit GLB and archive inputs
        if: steps.files.outputs.nwd != '0' || steps.files.outputs.aps != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.files.outputs.final }}
        run: |
          mkdir -p models/converted
          for f in models/incoming/*; do [ -f "$f" ] && git mv -k "$f" models/converted/; done
          touch models/incoming/.gitkeep
          git config user.name "nexus3d-bot"
          git config user.email "nexus3d-bot@users.noreply.github.com"
          git add -A models "$OUT"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Convert models to GLB"
          for i in 1 2 3; do git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
          # pushes made with GITHUB_TOKEN don't trigger other workflows, so start the Pages deploy explicitly
          if [ "$PUBLISH" = "true" ] && [ -f .github/workflows/deploy.yml ]; then gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"; fi
