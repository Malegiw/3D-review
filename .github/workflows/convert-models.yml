name: Convert models (NWD / DWFx / SKP → GLB)

# Company models are confidential: run this in a PRIVATE repository.
# Input:  files committed to models/incoming/ (≤ 100 MB each), or "Run workflow" with a direct download link.
# Output: GLB files as a downloadable workflow artifact (private to the repo) → import them in the app.
#         Set repository variable PUBLISH_MODELS=true only if the GLBs may be served publicly on GitHub Pages.
# Needs secrets APS_CLIENT_ID and APS_CLIENT_SECRET (free Autodesk Platform Services app: https://aps.autodesk.com).
on:
  push:
    branches: [main]
    paths: ['models/incoming/**']
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct download link to a .nwd / .dwfx / .skp / .rvt / .ifc file (optional)'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: convert-models
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUBLISH: ${{ vars.PUBLISH_MODELS == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Autodesk credentials
        id: creds
        env:
          ID: ${{ secrets.APS_CLIENT_ID }}
        run: |
          if [ -z "$ID" ]; then
            echo "::warning::APS_CLIENT_ID / APS_CLIENT_SECRET not set. Add them in Settings → Secrets and variables → Actions, then run this workflow again (files stay in models/incoming)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install converter
        if: steps.creds.outputs.ok == 'true'
        working-directory: tools
        run: npm ci

      - name: Convert with Autodesk APS
        id: convert
        if: steps.creds.outputs.ok == 'true'
        env:
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          FILE_URL: ${{ github.event.inputs.file_url }}
        run: |
          shopt -s nullglob nocaseglob
          files=(models/incoming/*.{nwd,nwc,nwf,dwfx,dwf,skp,rvt,ifc,dwg})
          if [ -n "$FILE_URL" ]; then files+=("$FILE_URL"); fi
          if [ ${#files[@]} -eq 0 ]; then echo "Nothing to convert"; echo "done=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          OUT=converted-glb
          if [ "$PUBLISH" = "true" ]; then OUT=public/models; fi
          node tools/aps-convert.mjs "${files[@]}" --out "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Upload GLB (download from this run's Summary page)
        if: steps.convert.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nexus3d-glb
          path: ${{ steps.convert.outputs.out }}/*.glb
          retention-days: 14

      - name: Archive processed inputs and commit
        if: steps.convert.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models/converted
          for f in models/incoming/*; do [ -f "$f" ] && git mv "$f" models/converted/ || true; done
          touch models/incoming/.gitkeep
          git config user.name "nexus3d-bot"
          git config user.email "nexus3d-bot@users.noreply.github.com"
          git add -A models
          if [ "$PUBLISH" = "true" ]; then git add -A public/models; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Convert models to GLB"
          git push
          # pushes made with GITHUB_TOKEN don't trigger other workflows, so start the Pages deploy explicitly
          if [ "$PUBLISH" = "true" ]; then gh workflow run deploy.yml --ref main; fi
